name: Scrape action

on:
  workflow_dispatch:
  schedule:
    # GitHub ActionsのcronはUTC基準。
    # 毎日 15:00 UTC（翌日 00:00 JST）に実行する。
    - cron: '0 15 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install dependencies
        run: |
          gem install bundler:2.1.4
          bundle install
        working-directory: ${{ github.workspace }}/Scraper

      - name: Run tests
        run: |
          bundle exec ruby -Itest -e 'Dir["test/**/*_test.rb"].sort.each { |file| require File.expand_path(file) }'
        working-directory: ${{ github.workspace }}/Scraper

      - name: Run scraper
        run: bundle exec ruby scrape.rb
        working-directory: ${{ github.workspace }}/Scraper

      - name: Build Pages site
        run: |
          mkdir -p _site/Viewer/resource

          cp index.html _site/
          cp -r Viewer/css _site/Viewer/
          cp -r Viewer/js _site/Viewer/
          cp -r Viewer/lib _site/Viewer/
          cp Scraper/result.json _site/Viewer/resource/result.json

      - name: Verify Pages site
        run: |
          test -f _site/index.html
          test -f _site/Viewer/resource/result.json

          ruby -rjson -e '
            data = JSON.parse(File.read("_site/Viewer/resource/result.json"))
            abort "ReferenceStationData is not an array" unless data["ReferenceStationData"].is_a?(Array)
          '

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4